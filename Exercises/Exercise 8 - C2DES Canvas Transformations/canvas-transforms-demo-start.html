<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Canvas Transforms Starter</title>
	<style>
	canvas{
		border:1px solid gray;
	}
	</style>
</head>
<body>
	<canvas width="640" height="480">
		Get a real browser!
	</canvas>
	<script>
		'use strict';
		
		let ctx = document.querySelector('canvas').getContext('2d');
		let rotation = 0;
		let rotationSpeed = .1;

		init();
	
		function init(){
			loop();
		}

		function loop() {
			requestAnimationFrame(loop);

			// background

			ctx.save();
			ctx.fillStyle = 'yellow'; 
			ctx.fillRect(0,0,640,480); 
	
			// do some transformations?
    		ctx.translate(320, 240);
			ctx.rotate(Math.PI/6 + rotationSpeed);
			ctx.translate(-320, -240);
			ctx.scale(1.2,1.2);
			
			
			// set a bunch of state attributes
			ctx.shadowOffsetX = 15;
			ctx.shadowOffsetY = 15;
			ctx.shadowColor = "rgba(153,50,204,.6)";
			ctx.shadowBlur = 5;
		
		
			// draw square with fillRect() convenience method
			ctx.fillStyle="green";
			ctx.fillRect(100,100,100,100);
		
			// draw square with rect()
			ctx.fillStyle="blue";
			ctx.beginPath();
			ctx.rect(300,100,100,100);
			ctx.closePath();
			ctx.fill();
			
			// draw squares with our helper function
			drawSquare1(ctx,100,0,100,100,"orange");
			drawSquare1(ctx,250,0,100,100,"orange");
			drawSquare1(ctx,400,0,100,100,"orange");
			ctx.restore();
		
			ctx.save();
			// draw a triangle
			ctx.translate(500, 150);
			ctx.rotate(Math.PI/6 + rotationSpeed);
			ctx.strokeStyle="red";
			ctx.fillStyle="red";
			ctx.lineWidth="5";
			ctx.beginPath();
			ctx.moveTo(500,100);
			ctx.lineTo(550,200);
			ctx.lineTo(450,200);
			ctx.closePath();
			ctx.stroke();
			ctx.restore();
			
			ctx.save();
			// draw a "better" triangle - why is this better? You'll see!
			ctx.translate(200, 300);
			ctx.rotate(Math.PI/6 + rotationSpeed);
			ctx.strokeStyle="red";
 			ctx.fillStyle="red";
 			ctx.lineWidth="5";
 			ctx.beginPath();
 			ctx.moveTo(0,-50);
 			ctx.lineTo(50,50);
 			ctx.lineTo(-50,50);
 			ctx.closePath();
 			ctx.stroke();
			ctx.restore();

			rotationSpeed += 0.01;

			// draw better rotating triangles with function
			drawTriangle1(ctx, 200, 400, "blue");
			drawTriangle1(ctx, 500, 200, "white");

			// Draw an animated circle
			ctx.save();
			ctx.translate(320, 400);
			ctx.rotate(Math.PI/6 + rotationSpeed);
			ctx.fillStyle = "purple";
			ctx.beginPath();
			ctx.arc(50, 20, 25, 0, Math.PI * 2);
			ctx.fill();

			ctx.restore();
		}

		function drawSquare1(ctx,x,y,width,height,fillStyle){
			ctx.save();
			ctx.fillStyle=fillStyle;
			ctx.fillRect(x,y,width,height);
			ctx.restore();
		}

		function drawTriangle1(ctx, x, y, strokeStyle, fillStyle) {
			ctx.save();
			ctx.translate(x, y)
			ctx.rotate(rotationSpeed);
			ctx.fillStyle = fillStyle;
			ctx.strokeStyle = strokeStyle
			ctx.lineWidth = "5";
			ctx.beginPath();
			ctx.moveTo(0,-50);
			ctx.lineTo(50,50);
			ctx.lineTo(-50,50);
			ctx.closePath();
			ctx.stroke();
			ctx.restore();
		}
	</script>
</body>
</html>
