<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Screensaver</title>
	<style>
	canvas{
		border:1px solid gray;
	}

	body{
		font-family: sans-serif;
	}
		
	button{
		font-size:1.2em;
	}
		
	section{
		margin:.5em 0 .5em 0;
	}
	</style>
	<script>
		// #0 - in this class we will always use ECMAScript 5's "strict" mode
		// See what 'use strict' does here:
		// https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions_and_function_scope/Strict_mode
		"use strict";
		
		// #1 call the `init` function after the pages loads
		window.onload = init;

        let ctx;
		let rectEnabled;
		let canvas;

		let playButton;
		let pauseButton;

		let isPlaying = true;

		function init() {
			console.log("page loaded!");
			// #2 Now that the page has loaded, start drawing!
			
			// A - `canvas` variable points at <canvas> tag
			canvas = document.querySelector("canvas");
			
			rectEnabled = document.querySelector("#rect");

			playButton = document.querySelector("#play");
			pauseButton = document.querySelector("#pause");
			// B - the `ctx` variable points at a "2D drawing context"
			ctx = canvas.getContext("2d");
			
			// C - all fill operations are now in red
			ctx.fillStyle = "red"; 
			
			// D - fill a rectangle with the current fill color
			ctx.fillRect(20,20,600,440); 


			// Blue Circle
			ctx.fillStyle = "cyan";
			ctx.beginPath();
			ctx.arc(200, 100, 50, 0, Math.PI * 2, false);
			ctx.closePath();
			ctx.fill();

			// Yellow Circle
			ctx.fillStyle = "yellow";
			ctx.beginPath();
			ctx.arc(400, 300, 80, 0, Math.PI * 2, false);
			ctx.closePath();
			ctx.fill();

            // Lines
			ctx.strokeStyle = "white";
			ctx.beginPath();
			ctx.moveTo(20, 200);
			ctx.lineTo(620, 200);
			ctx.lineWidth = 20;
			ctx.stroke();


			setupUI();

			// Update
            update();
		}

        function update() {
            requestAnimationFrame(update);

			// Check if playing
			if (!isPlaying) return;

			// Check if checkbox enabled, if so draw
            if (rectEnabled.checked) drawRandomRect(ctx);
        }

		// Draws random rects
		let drawRandomRect = (ctx) => {
			let x = getRandomInt(0, 480);
			let y = getRandomInt(0, 480);
			let width = getRandomInt(10, 200);
			let height = getRandomInt(10, 640);

			drawRectangle(ctx, x, y, width, height, `${getRandomColor()}`, `${getRandomColor()}`);
        }

		// Helper functions
		let sprayPaint = () => {

		}

		let setupUI = () => {
			pauseButton.onclick = () => {
				isPlaying = false;
			}

			playButton.onclick = () => {
				isPlaying = true;
			}

			canvas.onclick = canvasClicked;
		}

		// draws a rectangle
		let drawRectangle = (ctx,x,y,width,height,fillStyle="black",strokeStyle="black", lineWidth=0) => {
           	ctx.save();

			ctx.fillStyle = fillStyle;
            ctx.lineWidth = lineWidth;
            ctx.beginPath();
            ctx.rect(x, y, width, height);
            ctx.closePath();
            ctx.fill();

			ctx.restore();
		}

		// tells you if canvas was clicked
		function canvasClicked(e) {
			let rect = e.target.getBoundingClientRect();
			let mouseX = e.clientX - rect.x;
			let mouseY = e.clientY - rect.y;
			console.log(mouseX,mouseY);

			for (let i = 0; i < 10; i++) {
				let x = getRandomInt(-100, 100) + mouseX;
				let y = getRandomInt(-100, 100) + mouseY;
				let width = getRandomInt(20, 50);
				let height = getRandomInt(20, 50);
				let color = getRandomColor();
				drawRectangle(ctx, x, y, width, height, color);
			}
		}

		// gets a random rgba value
        let getRandomColor = () => {
            let getByte = () => {
                return 55 + Math.round(Math.random() * 200);
            }
            return `rgba(${getByte()},${getByte()},${getByte()},.8)`;
        }

		// gets a random int value
        let getRandomInt = (min, max) => {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
	</script>
</head>
<body>
	<canvas width="640" height="480">
		Get a real browser!
	</canvas>
	<br>
	<span>
		<button id = "play">Play</button>
		<button id = "pause">Pause</button>
	</span>
	<br><br>
	<span>
		<input type="checkbox" id ="rect" placeholder = "Rectangles">
		<label for="rect">Rectangles</label>
	</span>
	<p>Click on the screen to "spraypaint" rectangles (you probably want the screensaver to be paused).</p>
</body>
</html>
