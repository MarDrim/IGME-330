<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Sine Start</title>
	<style>canvas{ border: 1px solid black; }</style>
	<script>
	"use strict";
	const canvasWidth = 400, canvasHeight = 300;
	let ctx;
    let n = 0;
    let c = 4;
    let divergence = 137.5;
    const radius = 2;
    const fps = 60;

    let controls = document.querySelector("#controls");
    

	let init = () =>{
		ctx = canvas.getContext("2d");
		canvas.width = canvasWidth;
		canvas.height = canvasHeight;
		ctx.fillRect(0,0,canvasWidth,canvasHeight);
        loop();
	}

    window.onload = init;

    let loop = () => {
        setTimeout(loop,1000/fps);

        let a = n * dtr(divergence);
        let r = c * Math.sqrt(n);
        // console.log(a,r);
        
        let x = r * Math.cos(a) + canvasWidth/2;
        let y = r * Math.sin(a) + canvasHeight/2;
        // console.log(x,y);

        // RGB on n
        // let color = `rgb(${n % 256},0,255)`;

        // RGB on angle of the dot
        let aDegrees = (n * divergence) % 256;
        let color = `rgb(${aDegrees},0,255)`;

        //Hue Saturation Lightness Hue
        //let aDegrees = (n * divergence) % 361;
        //let color = `hsl(${aDegrees},100%,50%)`;

        // let color = `hsl(${n/5 % 361},100%,50%)`;

        drawCircle(ctx,x,y,2, color);
        n++;
        c += 0.01;
        divergence += 0.001;

    }

	// helpers
	let dtr = (degrees) => {
		return degrees * (Math.PI/180);
	}

	let drawCircle = (ctx,x,y,radius,color) => {
		ctx.save();
		ctx.fillStyle = color;
		ctx.beginPath();
		ctx.arc(x,y,radius,0,Math.PI * 2);
		ctx.closePath();
		ctx.fill();
		ctx.restore();
	}

	</script>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="controls">
	<label>Divergence Angle</label>
	<select id="ctrl-divergence">
		<option value="137.1">137.1</option>
		<option value="137.3">137.3</option>
		<option value="137.5" selected>137.5</option>
		<option value="137.7">137.7</option>
		<option value="137.7">137.9</option>
	</select>
	<button id="btn-restart">Restart App</button>
</div>
</body>
</html>
